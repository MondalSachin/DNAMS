<template>
  <lightning-card title="Transmittal Summaries" icon-name="standard:document">
    <template lwc:if={showEditButton}>
      <lightning-button slot="actions" label="Edit" onclick={handleEdit}></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={isEditing}>
        <lightning-record-edit-form
          record-id={recordId}
          object-api-name={objectApiName}
          onsubmit={handleSubmit}
          onsuccess={handleSuccess}
          onerror={handleError}
        >
          <lightning-messages></lightning-messages>
          <lightning-input-field field-name={ownershipField}></lightning-input-field>
          <lightning-input-field field-name={executiveField}></lightning-input-field>
          <div class="slds-var-m-top_small slds-text-align_right">
            <lightning-button label="Cancel" onclick={handleCancel} disabled={isSaving}></lightning-button>
            <lightning-button
              class="slds-var-m-left_x-small"
              variant="brand"
              type="submit"
              label="Save"
              disabled={isSaving}
            ></lightning-button>
          </div>
        </lightning-record-edit-form>
      </template>

      <template lwc:else>
        <h3 class="slds-text-title_caps slds-var-m-bottom_xx-small">Ownership Summary</h3>
        <div class="summary-box slds-box slds-var-m-bottom_medium" tabindex="0" aria-label="Ownership Summary">
          <template lwc:if={ownership}>
            <lightning-formatted-rich-text value={ownership}></lightning-formatted-rich-text>
          </template>
          <template lwc:else>
            <p class="slds-text-color_weak">Not drafted yet.</p>
          </template>
        </div>

        <h3 class="slds-text-title_caps slds-var-m-bottom_xx-small">Executive Summary</h3>
        <div class="summary-box slds-box" tabindex="0" aria-label="Executive Summary">
          <template lwc:if={executive}>
            <lightning-formatted-rich-text value={executive}></lightning-formatted-rich-text>
          </template>
          <template lwc:else>
            <p class="slds-text-color_weak">Not drafted yet.</p>
          </template>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
